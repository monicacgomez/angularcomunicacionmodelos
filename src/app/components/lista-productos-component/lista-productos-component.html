<h1 class="productos-titulo"> Nuestra colección </h1>

<div class="productos-grid">

  <article class="producto-card">
    <img
      [src]="producto.imagen"
      [alt]="producto.nombre"
      class="producto-imagen"
    />
    <div class="producto-info">
      <h2>{{ producto.nombre }}</h2>
      <p class="producto-precio">{{ producto.precio }} €</p>
    </div>
  </article>

  @for (prod of listaproductos; track prod) {
    <article class="producto-card">
      <img
        [src]="prod.imagen"
        [alt]="prod.nombre"
        class="producto-imagen"
      />
      <div class="producto-info">
        <h2>{{ prod.nombre }}</h2>
        <p class="producto-precio">{{ prod.precio }} €</p>
      </div>
    </article>
  }

</div>
